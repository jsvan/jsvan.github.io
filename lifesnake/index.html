<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Snake</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --border: #e2e2e0; --accent: #2f6fde; --input: #f2f2f0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113; --panel: #1c1c1f; --text: #ececee; --muted: #9a9aa0;
      --border: #2e2e33; --accent: #6b9cff; --input: #26262a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { display: flex; }
  #panel { width: 290px; flex: none; height: 100%; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--border); padding: 14px 16px 24px; }
  #map { flex: 1; height: 100%; position: relative; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  section { border-top: 1px solid var(--border); padding: 12px 0 4px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; }
  .row { display: grid; grid-template-columns: 74px 1fr 44px; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { color: var(--muted); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 100%; height: 24px; border: 1px solid var(--border); border-radius: 4px; padding: 0 2px; background: var(--input); }
  select, button { font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; }
  select { width: 100%; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .switch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text);
    text-transform: none; letter-spacing: 0; }
  .check { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  #drop { border: 1.5px dashed var(--border); border-radius: 8px; padding: 14px; text-align: center;
    color: var(--muted); cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #stats { color: var(--muted); margin-top: 8px; white-space: pre-line; }
  #clock { font-size: 15px; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
  #scrub { margin: 4px 0; }
  #overlay { position: absolute; inset: 0; pointer-events: none; z-index: 450; }
  #tip { position: absolute; z-index: 460; pointer-events: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 7px; font-size: 12px;
    white-space: nowrap; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #toggle { display: none; }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    #panel { width: 100%; height: auto; max-height: 50%; border-right: 0; border-bottom: 1px solid var(--border); }
    #panel.collapsed > :not(header) { display: none; }
    #toggle { display: inline-block; float: right; }
  }
</style>
</head>
<body>
<div id="panel">
  <header>
    <button id="toggle">Controls</button>
    <h1>Life Snake</h1>
    <p class="sub">Your data stays in this browser. Nothing is uploaded.</p>
  </header>

  <section>
    <div id="drop">Drop <b>locations.csv</b> here<br>or click to choose<input id="file" type="file" accept=".csv,.txt,text/csv" hidden></div>
    <div id="stats"></div>
    <div class="row"><label>Map</label>
      <select id="base" style="grid-column: span 2">
        <option value="osm">OpenStreetMap</option>
        <option value="streets">Streets (Esri)</option>
        <option value="light">Light gray (Esri)</option>
        <option value="dark">Dark gray (Esri)</option>
        <option value="sat">Satellite (Esri)</option>
      </select></div>
    <div class="btns"><button id="fit">Fit to data</button></div>
  </section>

  <section>
    <h2>Lines <span class="switch"><input type="checkbox" id="lineOn">show</span></h2>
    <div class="row"><label>Color</label><input type="color" id="lineColor"><span></span></div>
    <div class="row"><label>Width</label><input type="range" id="lineWidth" min="0.5" max="10" step="0.5"><output></output></div>
    <div class="row"><label>Opacity</label><input type="range" id="lineOpacity" min="0.02" max="1" step="0.02"><output></output></div>
    <label class="check"><input type="checkbox" id="lineStack">Overlaps darken (repeat routes stand out)</label>
  </section>

  <section>
    <h2>Points <span class="switch"><input type="checkbox" id="pointOn">show</span></h2>
    <div class="row"><label>Color</label><input type="color" id="pointColor"><span></span></div>
    <div class="row"><label>Size</label><input type="range" id="pointSize" min="0.5" max="12" step="0.5"><output></output></div>
    <div class="row"><label>Opacity</label><input type="range" id="pointOpacity" min="0.02" max="1" step="0.02"><output></output></div>
  </section>

  <section>
    <h2>Routes <span class="switch"><input type="checkbox" id="routeOn">show</span></h2>
    <div class="row"><label>Color</label><input type="color" id="routeColor"><span></span></div>
    <div class="row"><label>Width</label><input type="range" id="routeWidth" min="0.5" max="12" step="0.5"><output></output></div>
    <div class="row"><label>Opacity</label><input type="range" id="routeOpacity" min="0.02" max="1" step="0.02"><output></output></div>
    <div id="routeInfo" class="sub"></div>
  </section>

  <section>
    <h2>Age fade</h2>
    <div class="row"><label>Fade old</label><input type="range" id="fade" min="0" max="1" step="0.05"><output></output></div>
    <p class="sub" style="margin:0">Older lines and points get more transparent. During playback "old" is relative to the snake's head.</p>
  </section>

  <section>
    <h2>Animation</h2>
    <div id="clock">—</div>
    <input type="range" id="scrub" min="0" max="1000" step="1" value="1000">
    <div class="btns">
      <button id="play" class="primary">▶ Play</button>
      <button id="restart">⏮ Start</button>
      <button id="end">⏭ End</button>
    </div>
    <div class="row"><label>Speed</label>
      <select id="speed" style="grid-column: span 2">
        <option value="1">1 hour / sec</option>
        <option value="6">6 hours / sec</option>
        <option value="24">1 day / sec</option>
        <option value="168">1 week / sec</option>
        <option value="720">1 month / sec</option>
        <option value="8760">1 year / sec</option>
      </select></div>
    <div class="row"><label>Tail</label>
      <select id="tail" style="grid-column: span 2">
        <option value="0">Whole history</option>
        <option value="24">Last day</option>
        <option value="168">Last week</option>
        <option value="720">Last month</option>
        <option value="2160">Last 3 months</option>
        <option value="8760">Last year</option>
      </select></div>
    <div class="row"><label>Head</label><input type="color" id="headColor"><span></span></div>
    <label class="check"><input type="checkbox" id="follow">Follow the head</label>
    <label class="check"><input type="checkbox" id="loop">Loop</label>
  </section>
</div>
<div id="map"><canvas id="overlay"></canvas><div id="tip"></div></div>

<script id="routes-code" type="text/plain">
// Routes: the ways you travel, inferred from the whole history with no map. Runs in a worker on upload.
// self.computeRoutes(P) → { routes: [[[lat, lon], ...], ...], trips, ms }, P = [{ t, lat, lon, lonU }] in time order.
//
// Places are where you stayed. A trip is the samples between two consecutive stays; its dots (start place,
// samples, end place) are certain: you were at each one, in that order.
// 1. Trips between the same two places that could have been as quick as the quickest made no stop, so they
//    rode one of a few routes. Each trip gets a probability of each route and of going its own way; two or
//    more trips that go their own way found a new route. Repeat until no trip changes route; a trip still
//    going its own way then is a route of its own.
// 2. Any trip whose consecutive dots fit a route better than its own way rode it there, and the route takes
//    those samples as stepping stones. Repeat until no route gains a sample.
// A dot x fits a route by its detour between the route's points u and v around it (the trip's own samples
// left out): bend = (|ux| + |xv| − |uv|) / max(|uv|, 50 m). Nothing has a length scale but the phone's
// accuracy, so walks and flights follow the same rules. As a density, bend ~ Exp(λ) spread over the
// ellipse of equal bend: log p = −λ·bend − 2 log D − log z(λ), D = max(|uv|, 50 m); λ by maximum likelihood.
(function () {
const EARTH = 6371000, RAD = Math.PI / 180, FLOOR = 50, ALPHA = 1;
const STAY_M = 100;
const toV = (lat, lon) => { const c = Math.cos(lat * RAD); return [EARTH * c * Math.cos(lon * RAD), EARTH * c * Math.sin(lon * RAD), EARTH * Math.sin(lat * RAD)]; };
const toLL = ([x, y, z]) => [Math.asin(z / Math.hypot(x, y, z)) / RAD, Math.atan2(y, x) / RAD];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;

// Locations: where you stayed. A stay is a run of consecutive samples within STAY_M of its first, lasting at
// least half the typical sampling interval (read from the data; half, because samples land a little early or
// late): two samples at the same spot an interval apart, or the two ends of a long gap when the phone lay
// still and recorded nothing. Stays within STAY_M of each other, on any outing, are one location.
function findPlaces(P) {
  const meters = (a, b) => Math.hypot((b.lonU - a.lonU) * 111320 * Math.cos(a.lat * RAD), (b.lat - a.lat) * 111320);
  const dts = []; for (let n = 1; n < P.length; n++) dts.push(P[n].t - P[n - 1].t);
  dts.sort((a, b) => a - b);
  const step = dts[dts.length >> 1], stays = [];
  for (let i = 0; i < P.length;) {
    let j = i;
    while (j + 1 < P.length && meters(P[i], P[j + 1]) <= STAY_M) j++;
    if (j > i && P[j].t - P[i].t >= step / 2) {
      const s = { from: i, to: j, lat: 0, lonU: 0 };
      for (let k = i; k <= j; k++) { s.lat += P[k].lat / (j - i + 1); s.lonU += P[k].lonU / (j - i + 1); }
      stays.push(s);
    }
    i = j + 1;
  }
  const parent = stays.map((_, i) => i), find = i => parent[i] === i ? i : (parent[i] = find(parent[i])), grid = new Map();
  const cell = s => [Math.floor(s.lat * 111320 / STAY_M), Math.floor(s.lonU * 111320 * Math.cos(s.lat * RAD) / STAY_M)];
  stays.forEach((s, i) => { const [a, b] = cell(s); (grid.get(a + ',' + b) || grid.set(a + ',' + b, []).get(a + ',' + b)).push(i); });
  stays.forEach((s, i) => { const [a, b] = cell(s); for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) for (const k of grid.get((a + di) + ',' + (b + dj)) || []) if (k > i && meters(s, stays[k]) <= STAY_M) parent[find(k)] = find(i); });
  const byRoot = new Map();
  stays.forEach((s, i) => { const r = find(i); (byRoot.get(r) || byRoot.set(r, []).get(r)).push(s); });
  const places = [...byRoot.values()].map(ss => {
    const members = ss.flatMap(s => Array.from({ length: s.to - s.from + 1 }, (_, k) => s.from + k));
    return { members, lat: members.reduce((a, n) => a + P[n].lat, 0) / members.length, lon: members.reduce((a, n) => a + P[n].lonU, 0) / members.length };
  });
  places.sort((a, b) => b.members.length - a.members.length);
  const placeOf = new Int32Array(P.length).fill(-1);
  places.forEach((pl, id) => { for (const n of pl.members) placeOf[n] = id; });
  return { places, placeOf };
}

// Trips: the samples between two consecutive stays (the same place for a round trip).
function findTrips(P, placeOf) {
  const trips = [];
  let last = -1;
  for (let n = 0; n < P.length; n++) {
    if (placeOf[n] < 0) continue;
    if (last >= 0 && n - last > 1) {
      const words = [];
      for (let k = last + 1; k < n; k++) words.push(k);
      trips.push({ a: placeOf[last], b: placeOf[n], span: P[n].t - P[last].t, words });
    }
    last = n;
  }
  return trips;
}

function pairRoutes(P, places, trips) {
  const X = P.map(p => toV(p.lat, p.lonU)), PL = places.map(p => toV(p.lat, p.lon));
  const dts = []; for (let n = 1; n < P.length; n++) dts.push(P[n].t - P[n - 1].t);
  dts.sort((a, b) => a - b);
  const step = dts[dts.length >> 1];   // the typical sampling interval
  // A sample's weight: the time it stands for relative to the typical interval, at most 1, so a trip sampled
  // every minute counts about as much as a sparse trip of the same duration, not sixty times as much.
  const wt = new Float64Array(P.length);
  for (let n = 0; n < P.length; n++) wt[n] = Math.min(1, ((n > 0 ? Math.min(step, P[n].t - P[n - 1].t) : step) + (n < P.length - 1 ? Math.min(step, P[n + 1].t - P[n].t) : step)) / 2 / step);

  // Trips with samples: dots = start place, samples, end place; ids[k] = the sample of dot k (−1: a place).
  const T = trips.filter(t => t.words.length).map((t, k) => ({ k, a: t.a, b: t.b, span: t.span, w: t.words,
    dots: [PL[t.a], ...t.words.map(n => X[n]), PL[t.b]], ids: [-1, ...t.words, -1], prob: null, pOther: 1, best: null }));
  const tripOf = new Map(); T.forEach(t => t.w.forEach(n => tripOf.set(n, t.k)));

  // A detour of x between u and v: its bend, and log D, the scale it is spread over.
  const detour = (u, x, v) => { const uv = dist(u, v), D = Math.max(uv, FLOOR); return { b: (dist(u, x) + dist(x, v) - uv) / D, lD: Math.log(D) }; };
  const own = (t, k) => detour(t.dots[k - 1], t.dots[k], t.dots[k + 1]);
  const onRoute = (R, x, tk) => {   // u, v: R's nearest points around x that are not trip tk's
    let i = segmentOf(R.line, x) - 1, j = i + 1;
    while (i > 0 && R.vt[i] === tk) i--;
    while (j < R.line.length - 1 && R.vt[j] === tk) j++;
    return detour(R.line[i], x, R.line[j]);
  };
  // log z(λ) = log ∫ e^(−λb) dA(b), A(b) = π/4 (1 + b) √(b (2 + b)): the area inside bend b for D = 1.
  const area = b => Math.PI / 4 * (1 + b) * Math.sqrt(b * (2 + b));
  const logz = l => { let s = 0; const n = 400, h = 8 / n; for (let k = 1; k <= n; k++) { const v = k * h; s += Math.exp(-v * v) * area(v * v / l) * 2 * v * (k === n ? 0.5 : 1); } return Math.log(s * h); };
  let lambda = 5, lz = logz(lambda);
  const logp = d => -lambda * d.b - 2 * d.lD - lz;

  // A route: its samples with their probability (pts); stage-1 samples (core) fix its shape, later ones may
  // only add stepping stones between two consecutive core points. Its line runs from place a to place b by
  // the path whose hops cost length² (a Fermat path), so it steps through evidence rather than jumping.
  function route(a, b, pts) { const R = { a, b, pts, core: null }; redraw(R); return R; }
  function redraw(R) {
    const keep = [...R.pts].filter(([, p]) => p > 0.5).map(([n]) => n);
    const core = R.core ? keep.filter(n => R.core.has(n)) : keep, rest = R.core ? keep.filter(n => !R.core.has(n)) : [];
    let ids = [-1, ...fermat(core.map(n => X[n]), PL[R.a], PL[R.b]).map(k => core[k]), -1];
    if (rest.length) {   // only points inside the ball on a hop as diameter can shorten it
      const pos = (n, k) => n >= 0 ? X[n] : k === 0 ? PL[R.a] : PL[R.b], out = [-1];
      for (let k = 1; k < ids.length; k++) {
        const u = pos(ids[k - 1], k - 1), v = pos(ids[k], k), c = u.map((s, i) => (s + v[i]) / 2), r2 = d2(u, v) / 4;
        const inside = rest.filter(n => d2(X[n], c) < r2);
        out.push(...fermat(inside.map(n => X[n]), u, v).map(i => inside[i]), ids[k]);
      }
      ids = out;
    }
    R.vt = ids.map(n => n < 0 ? -1 : tripOf.get(n));
    R.line = ids.map((n, k) => n >= 0 ? X[n] : k === 0 ? PL[R.a] : PL[R.b]);
    R.c = [0, 1, 2].map(i => R.line.reduce((s, p) => s + p[i], 0) / R.line.length);
    R.r = Math.max(...R.line.map(p => dist(p, R.c)));
  }

  // Equivalent trips per pair of places. A trip's true duration lies between the time from its first to its
  // last sample (surely moving) and its span (last sample at A to first at B); it is equivalent when it could
  // have been as quick as the pair's quickest span.
  const byPair = new Map(), eqSets = [];
  for (const t of T) if (t.a !== t.b) {
    const key = t.a < t.b ? t.a + ',' + t.b : t.b + ',' + t.a;
    (byPair.get(key) || byPair.set(key, []).get(key)).push(t);
  }
  for (const ts of byPair.values()) {
    const quickest = Math.min(...ts.map(t => t.span)), E = ts.filter(t => P[t.w[t.w.length - 1]].t - P[t.w[0]].t <= quickest);
    if (E.length) eqSets.push(E);
  }

  // 1. Routes from equivalent trips; λ is refitted until it settles.
  let routes;
  const sumRoute = (R, t) => t.w.reduce((s, n) => s + wt[n] * logp(onRoute(R, X[n], t.k)), 0);
  const sumOwn = t => t.w.reduce((s, n, i) => s + wt[n] * logp(own(t, i + 1)), 0);
  const from = ts => new Map(ts.flatMap(t => t.w.map(n => [n, 1])));
  function stage1() {
    routes = [];
    for (const E of eqSets) {
      const { a, b } = E[0];
      if (E.length === 1) {   // one trip: its route is the trip
        const t = E[0], R = route(a, b, from(E));
        t.prob = new Map([[R, 1]]); t.pOther = 0; t.best = R;
        R.members = new Set(E); R.core = new Set(t.w); routes.push(R);
        continue;
      }
      let rs = [route(a, b, from(E))];
      for (const t of E) t.best = rs[0];
      const tried = new Set(), seen = new Set();
      for (let it = 0; it < 30; it++) {
        const count = new Map(rs.map(R => [R, 0]));
        for (const t of E) if (t.best) count.set(t.best, count.get(t.best) + 1);
        for (const t of E) {   // P(route) ∝ the pair's other trips on it · Π p; P(own way) ∝ α · Π p
          const ll = rs.map(R => { const n = count.get(R) - (t.best === R ? 1 : 0); return n > 0 ? Math.log(n) + sumRoute(R, t) : -Infinity; });
          const lo = Math.log(ALPHA) + sumOwn(t), m = Math.max(lo, ...ll);
          const z = ll.reduce((s, l) => s + Math.exp(l - m), Math.exp(lo - m));
          t.prob = new Map(rs.map((R, k) => [R, Math.exp(ll[k] - m) / z])); t.pOther = Math.exp(lo - m) / z;
        }
        for (const t of E) { t.best = null; let p = t.pOther; for (const [R, q] of t.prob) if (q > p) { t.best = R; p = q; } }
        // A route most likely for fewer than two trips is dropped (unless it is the pair's only one).
        const kept = rs.filter(R => rs.length === 1 || E.filter(t => t.best === R).length >= 2);
        const O = E.filter(t => !t.best), key = O.map(t => t.k).join();
        const state = E.map(t => rs.indexOf(t.best)).join() + '|' + kept.length;
        if (kept.length === rs.length && seen.has(state) && (O.length < 2 || tried.has(key))) break;   // settled (or repeating)
        seen.add(state);
        for (const t of E) if (t.best && !kept.includes(t.best)) t.best = null;
        rs = kept;
        for (const R of rs) { R.pts = new Map(E.flatMap(t => t.w.map(n => [n, t.prob.get(R) || 0]))); redraw(R); }
        if (O.length >= 2 && !tried.has(key)) { tried.add(key); const R = route(a, b, from(O)); rs.push(R); for (const t of O) t.best = R; }
      }
      // A trip that goes its own way is still a certain path between the two places: a route of its own.
      for (const t of E) if (!t.best) rs.push(route(a, b, from([t])));
      for (const R of rs) { R.members = new Set(E); R.core = new Set([...R.pts].filter(([, p]) => p > 0.5).map(([n]) => n)); }
      routes.push(...rs);
    }
  }
  for (let pass = 0; pass < 6; pass++) {
    stage1();
    let sb = 0, N = 0;   // maximum likelihood: maximize −λ Σ b − N log z(λ)
    for (const E of eqSets) if (E.length > 1) for (const t of E)
      t.w.forEach((n, i) => { sb += wt[n] * (t.best ? onRoute(t.best, X[n], t.k) : own(t, i + 1)).b; N += wt[n]; });
    let lo = Math.log(0.01), hi = Math.log(1000); const g = (Math.sqrt(5) - 1) / 2, f = ll => -Math.exp(ll) * sb - N * logz(Math.exp(ll));
    for (let k = 0; k < 60; k++) { const m1 = hi - g * (hi - lo), m2 = lo + g * (hi - lo); if (f(m1) < f(m2)) lo = m1; else hi = m2; }
    const next = Math.exp((lo + hi) / 2);
    if (Math.abs(next - lambda) < 0.05 * lambda) break;
    lambda = next; lz = logz(lambda);
  }

  // 2. Grow: a trip's longest run of consecutive dots (two or more) that fit a route better than its own way;
  // a place fits when it bends the route less than a typical sample does.
  for (let round = 0; round < 30; round++) {
    let added = 0; const dirty = new Set();
    for (const t of T) for (const R of routes) {
      if (R.members.has(t) || t.dots.every(x => dist(x, R.c) > 1.5 * R.r + FLOOR)) continue;
      const last = t.dots.length - 1;
      const lr = t.dots.map((x, k) => k === 0 || k === last ? 1 - lambda * onRoute(R, x, t.k).b : wt[t.ids[k]] * (logp(onRoute(R, x, t.k)) - logp(own(t, k))));
      let run = null;
      for (let i = 0; i < lr.length;) {
        if (lr[i] <= 0) { i++; continue; }
        let j = i, s = 0;
        while (j < lr.length && lr[j] > 0) s += lr[j++];
        if (!run || j - i > run.to - run.from + 1 || (j - i === run.to - run.from + 1 && s > run.sum)) run = { from: i, to: j - 1, sum: s };
        i = j;
      }
      if (!run || run.to === run.from) continue;
      const Prun = 1 / (1 + Math.exp(-run.sum));
      for (let k = run.from; k <= run.to; k++) {
        const n = t.ids[k];
        if (n >= 0 && (R.pts.get(n) || 0) < Prun - 1e-9) { R.pts.set(n, Prun); added++; dirty.add(R); }
      }
    }
    for (const R of dirty) redraw(R);
    if (!added) break;
  }
  return { routes: routes.map(R => R.line.map(toLL)), trips: T.length };
}

// The segment (index of its end vertex) of `line` nearest to x.
function segmentOf(line, x) {
  let best = Infinity, seg = 1;
  for (let k = 1; k < line.length; k++) {
    const a = line[k - 1], b = line[k], ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], l2 = ab[0] ** 2 + ab[1] ** 2 + ab[2] ** 2;
    const f = l2 ? Math.max(0, Math.min(1, ((x[0] - a[0]) * ab[0] + (x[1] - a[1]) * ab[1] + (x[2] - a[2]) * ab[2]) / l2)) : 0;
    const e = (x[0] - a[0] - f * ab[0]) ** 2 + (x[1] - a[1] - f * ab[1]) ** 2 + (x[2] - a[2] - f * ab[2]) ** 2;
    if (e < best) { best = e; seg = k; }
  }
  return seg;
}

// Fermat path from p to q through pts (Dijkstra on the complete graph, hop cost length²): the indices of
// the points it passes, in order.
function fermat(pts, p, q) {
  const V = pts.length + 2, Y = [...pts, p, q], s0 = V - 2, t = V - 1;
  const best = new Float64Array(V).fill(Infinity), prev = new Int32Array(V).fill(-1), done = new Uint8Array(V);
  best[s0] = 0;
  for (;;) {
    let u = -1;
    for (let i = 0; i < V; i++) if (!done[i] && (u < 0 || best[i] < best[u])) u = i;
    if (u < 0 || u === t || best[u] === Infinity) break;
    done[u] = 1;
    for (let i = 0; i < V; i++) if (!done[i]) {
      const c = best[u] + d2(Y[i], Y[u]);
      if (c < best[i]) { best[i] = c; prev[i] = u; }
    }
  }
  const out = [];
  for (let u = prev[t]; u >= 0 && u !== s0; u = prev[u]) out.push(u);
  return out.reverse();
}

self.computeRoutes = P => {
  const t0 = Date.now(), { places, placeOf } = findPlaces(P), r = pairRoutes(P, places, findTrips(P, placeOf));
  return { ...r, ms: Date.now() - t0 };
};
})();
</script>

<script>
const DEFAULTS = {
  base: 'osm', lineOn: true, lineColor: '#e0352b', lineWidth: 2, lineOpacity: 0.5, lineStack: true,
  pointOn: true, pointColor: '#1f5fd1', pointSize: 2.5, pointOpacity: 0.6, fade: 0,
  routeOn: true, routeColor: '#7b2cbf', routeWidth: 3, routeOpacity: 0.45,
  speed: '24', tail: '0', headColor: '#ff9500', follow: false, loop: false,
};
const S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem('lifesnake-settings') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('lifesnake-settings', JSON.stringify(S)); } catch (e) {} };

// ---------- Map ----------
const map = L.map('map', { zoomAnimation: false, worldCopyJump: false, minZoom: 1 }).setView([30, 0], 2);
const BASES = {
  light: ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', 'Tiles &copy; Esri', 16],
  dark: ['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', 'Tiles &copy; Esri', 16],
  streets: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', 'Tiles &copy; Esri'],
  osm: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png', '&copy; OpenStreetMap contributors'],
  sat: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 'Imagery &copy; Esri'],
};
let baseLayer;
function setBase(k) {
  if (baseLayer) map.removeLayer(baseLayer);
  baseLayer = L.tileLayer(BASES[k][0], { attribution: BASES[k][1], maxNativeZoom: BASES[k][2] || 19, maxZoom: 19, referrerPolicy: 'strict-origin-when-cross-origin' }).addTo(map);
}

// ---------- Parsing ----------
// Rows look like "1/13/24, 10:00:02, lat, lon" (US) or "29.10.2026, 13:00:02, lat, lon" (EU);
// the date style can change mid-file when the phone's region changes, so detect it per row.
function parseCSV(text) {
  const raw = [];
  for (const line of text.split(/\r?\n/)) {
    const f = line.split(',').map(x => x.trim().replace(/^"|"$/g, ''));
    if (f.length < 3) continue;
    const lat = Number(f[f.length - 2]), lon = Number(f[f.length - 1]);
    if (f[f.length - 2] === '' || !isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) continue;
    raw.push({ dt: f.slice(0, -2).join(' ').replace(/[  ]/g, ' '), lat, lon });
  }
  // Slash dates are M/D/Y unless some row proves otherwise (first field > 12).
  const slashDayFirst = raw.some(r => { const m = r.dt.match(/^(\d{1,2})\/(\d{1,2})\//); return m && +m[1] > 12; });
  const pts = []; let skipped = 0;
  for (const r of raw) {
    const t = parseDate(r.dt, slashDayFirst);
    if (isNaN(t)) { skipped++; continue; }
    pts.push({ t, lat: r.lat, lon: r.lon });
  }
  pts.sort((a, b) => a.t - b.t);
  return { pts, skipped };
}
function parseDate(s, slashDayFirst) {
  let y, mo, d;
  let m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
  else if ((m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) {
    if (slashDayFirst) { d = +m[1]; mo = +m[2]; } else { mo = +m[1]; d = +m[2]; }
    y = +m[3];
  } else return Date.parse(s.replace(' at ', ' '));
  if (y < 100) y += 2000;
  let h = 0, mi = 0, se = 0;
  const tm = s.slice(m.index + m[0].length).match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?\.?[Mm]?/);
  if (tm) {
    h = +tm[1]; mi = +tm[2]; se = +(tm[3] || 0);
    if (tm[4]) { const pm = /p/i.test(tm[4]); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
  }
  return new Date(y, mo - 1, d, h, mi, se).getTime();
}

// ---------- Data ----------
let P = [];            // sorted points; lonU = longitude unwrapped across the antimeridian
let T0 = 0, T1 = 0, playT = 0;
function setData(pts, skipped, name) {
  let prev = null;
  for (const p of pts) {
    let lon = p.lon;
    if (prev !== null) { while (lon - prev > 180) lon -= 360; while (lon - prev < -180) lon += 360; }
    p.lonU = lon; prev = lon;
  }
  P = pts;
  T0 = P.length ? P[0].t : 0; T1 = P.length ? P[P.length - 1].t : 0; playT = T1;
  const fmt = t => new Date(t).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  $('stats').textContent = P.length
    ? `${name}\n${P.length.toLocaleString()} points · ${fmt(T0)} → ${fmt(T1)}` + (skipped ? `\n${skipped} rows skipped (unreadable date)` : '')
    : `${name}: no valid rows found`;
  fit(); updateClock(); draw();
  computeRoutesFor(P);
}
// ---------- Routes ----------
// Routes are inferred from the whole history when a file is loaded (the code in #routes-code), in a worker
// so the page stays responsive. They are a static layer: the animation does not affect them.
let routes = [], routeJob = 0;
function computeRoutesFor(pts) {
  const job = ++routeJob, info = $('routeInfo');
  routes = []; info.textContent = pts.length ? 'Finding routes…' : '';
  if (!pts.length) return;
  const data = pts.map(p => ({ t: p.t, lat: p.lat, lon: p.lon, lonU: p.lonU }));
  const done = r => {
    if (job !== routeJob) return;
    // Unwrap each route's longitudes so it never jumps across the antimeridian.
    routes = r.routes.map(l => { let prev = null; return l.map(([la, lo]) => { if (prev !== null) { while (lo - prev > 180) lo -= 360; while (lo - prev < -180) lo += 360; } prev = lo; return [la, lo]; }); });
    info.textContent = `${routes.length} routes from ${r.trips.toLocaleString()} trips · ${(r.ms / 1000).toFixed(1)} s`;
    draw();
  };
  const fail = e => { if (job === routeJob) info.textContent = 'Routes failed: ' + (e.message || e); };
  const code = $('routes-code').textContent;
  try {
    const w = new Worker(URL.createObjectURL(new Blob([code + '\nself.onmessage = e => postMessage(computeRoutes(e.data));'], { type: 'text/javascript' })));
    w.onmessage = e => { done(e.data); w.terminate(); };
    w.onerror = e => { e.preventDefault(); w.terminate(); runHere(); };
    w.postMessage(data);
  } catch (e) { runHere(); }
  // Without workers (some browsers refuse them for pages opened from a file), compute on this thread.
  function runHere() {
    setTimeout(() => {
      try { if (!self.computeRoutes) (0, eval)(code); done(self.computeRoutes(data)); } catch (e) { fail(e); }
    }, 30);
  }
}
function fit() {
  if (!P.length) return;
  map.fitBounds(L.latLngBounds(P.map(p => [p.lat, p.lonU])), { padding: [30, 30] });
}

// ---------- Drawing ----------
const canvas = $('overlay'), ctx = canvas.getContext('2d');
let drawn = { from: 0, to: -1, xy: new Float64Array(0), W: 256 };
const lowerBound = t => { let lo = 0, hi = P.length; while (lo < hi) { const m = (lo + hi) >> 1; if (P[m].t < t) lo = m + 1; else hi = m; } return lo; };

function draw() {
  const size = map.getSize(), dpr = window.devicePixelRatio || 1;
  if (canvas.width !== size.x * dpr || canvas.height !== size.y * dpr) {
    canvas.width = size.x * dpr; canvas.height = size.y * dpr;
    canvas.style.width = size.x + 'px'; canvas.style.height = size.y + 'px';
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size.x, size.y);
  if (!P.length) return;

  if (S.routeOn && routes.length) {   // one path per route; where routes overlap they darken
    const W = 256 * Math.pow(2, map.getZoom()), lines = routes.map(l => l.map(ll => map.latLngToContainerPoint(ll)));
    let minX = Infinity, maxX = -Infinity;
    for (const l of lines) for (const c of l) { if (c.x < minX) minX = c.x; if (c.x > maxX) maxX = c.x; }
    ctx.strokeStyle = S.routeColor; ctx.lineWidth = S.routeWidth; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = S.routeOpacity;
    for (let k = Math.max(-3, Math.ceil(-maxX / W)); k <= Math.min(3, Math.floor((size.x - minX) / W)); k++)
      for (const l of lines) { ctx.beginPath(); l.forEach((c, i) => i ? ctx.lineTo(c.x + k * W, c.y) : ctx.moveTo(c.x + k * W, c.y)); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  const tail = +S.tail * 3600e3;
  const end = lowerBound(playT + 1) - 1;               // last point with t <= playT
  if (end < 0) return;
  const from = tail ? Math.min(lowerBound(playT - tail), end) : 0;
  const n = end - from + 1;

  // Interpolated head between `end` and the next point, so the snake moves smoothly.
  let head = null;
  if (end < P.length - 1 && playT < T1) {
    const a = P[end], b = P[end + 1], f = (playT - a.t) / (b.t - a.t);
    head = [a.lat + (b.lat - a.lat) * f, a.lonU + (b.lonU - a.lonU) * f];
  } else if (playT < T1 || playing) head = [P[end].lat, P[end].lonU];

  const xy = new Float64Array((n + 1) * 2);
  let minX = Infinity, maxX = -Infinity;
  for (let i = 0; i < n; i++) {
    const p = P[from + i], c = map.latLngToContainerPoint([p.lat, p.lonU]);
    xy[2 * i] = c.x; xy[2 * i + 1] = c.y;
    if (c.x < minX) minX = c.x; if (c.x > maxX) maxX = c.x;
  }
  if (head) { const c = map.latLngToContainerPoint(head); xy[2 * n] = c.x; xy[2 * n + 1] = c.y; }
  const W = 256 * Math.pow(2, map.getZoom());          // pixel width of one world copy
  drawn = { from, to: end, xy, W };

  const span = tail || Math.max(playT - T0, 1);
  const alphaAt = i => S.fade ? Math.max(0.02, 1 - S.fade * Math.min(1, (playT - P[from + i].t) / span)) : 1;

  const k0 = Math.max(-3, Math.ceil(-maxX / W)), k1 = Math.min(3, Math.floor((size.x - minX) / W));
  for (let k = k0; k <= k1; k++) {
    ctx.save(); ctx.translate(k * W, 0);
    if (S.lineOn) {
      ctx.strokeStyle = S.lineColor; ctx.lineWidth = S.lineWidth; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const last = head ? n : n - 1;
      if (!S.lineStack && !S.fade) {
        ctx.globalAlpha = S.lineOpacity; ctx.beginPath(); ctx.moveTo(xy[0], xy[1]);
        for (let i = 1; i <= last; i++) ctx.lineTo(xy[2 * i], xy[2 * i + 1]);
        ctx.stroke();
      } else {
        for (let i = 1; i <= last; i++) {
          ctx.globalAlpha = S.lineOpacity * alphaAt(i - 1);
          ctx.beginPath(); ctx.moveTo(xy[2 * i - 2], xy[2 * i - 1]); ctx.lineTo(xy[2 * i], xy[2 * i + 1]); ctx.stroke();
        }
      }
    }
    if (S.pointOn) {
      ctx.fillStyle = S.pointColor;
      for (let i = 0; i < n; i++) {
        ctx.globalAlpha = S.pointOpacity * alphaAt(i);
        ctx.beginPath(); ctx.arc(xy[2 * i], xy[2 * i + 1], S.pointSize, 0, 6.2832); ctx.fill();
      }
    }
    if (head) {
      const hx = xy[2 * n], hy = xy[2 * n + 1], r = Math.max(5, S.pointSize + 3);
      ctx.globalAlpha = 1; ctx.fillStyle = S.headColor; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(hx, hy, r, 0, 6.2832); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
}
map.on('move zoom resize viewreset', draw);

// ---------- Hover tooltip ----------
const tip = $('tip');
map.on('mousemove', e => {
  const { from, to, xy, W } = drawn, mx = e.containerPoint.x, my = e.containerPoint.y;
  let best = -1, bestD = Math.max(8, S.pointSize + 4) ** 2;
  for (let i = 0; i <= to - from; i++) {
    let dx = ((mx - xy[2 * i]) % W + W) % W; dx = Math.min(dx, W - dx);
    const dy = my - xy[2 * i + 1], d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = from + i; }
  }
  if (best < 0 || (!S.pointOn && !S.lineOn)) { tip.style.display = 'none'; return; }
  const p = P[best];
  tip.textContent = `${new Date(p.t).toLocaleString()}  ·  ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`;
  tip.style.display = 'block';
  tip.style.left = Math.min(mx + 12, map.getSize().x - tip.offsetWidth - 4) + 'px';
  tip.style.top = (my + 12) + 'px';
});
map.on('mouseout', () => tip.style.display = 'none');

// ---------- Animation ----------
let playing = false, lastFrame = 0;
function updateClock() {
  $('clock').textContent = P.length ? new Date(playT).toLocaleString(undefined,
    { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  $('scrub').value = T1 > T0 ? Math.round((playT - T0) / (T1 - T0) * 1000) : 1000;
}
function setPlaying(on) {
  playing = on && P.length > 0;
  $('play').textContent = playing ? '❚❚ Pause' : '▶ Play';
  if (playing) {
    if (playT >= T1) playT = T0;
    lastFrame = performance.now(); requestAnimationFrame(tick);
  }
  draw();
}
function tick(now) {
  if (!playing) return;
  const dt = Math.min(now - lastFrame, 100) / 1000; lastFrame = now;
  playT += dt * +S.speed * 3600e3;
  if (playT >= T1) {
    if (S.loop) playT = T0; else { playT = T1; updateClock(); setPlaying(false); return; }
  }
  if (S.follow) {
    const i = Math.max(0, lowerBound(playT + 1) - 1), ll = L.latLng(P[i].lat, P[i].lonU);
    if (!map.getBounds().pad(-0.2).contains(ll)) map.panTo(ll, { animate: false });
  }
  updateClock(); draw();
  requestAnimationFrame(tick);
}
$('play').onclick = () => setPlaying(!playing);
$('restart').onclick = () => { playT = T0; updateClock(); draw(); };
$('end').onclick = () => { setPlaying(false); playT = T1; updateClock(); draw(); };
$('scrub').oninput = e => { playT = T0 + (T1 - T0) * (+e.target.value / 1000); updateClock(); draw(); };

// ---------- Controls ----------
function $(id) { return document.getElementById(id); }
for (const key of Object.keys(DEFAULTS)) {
  const el = $(key); if (!el) continue;
  const out = el.parentElement.querySelector('output');
  const show = () => { if (out) out.textContent = el.step && +el.step < 0.1 ? Math.round(el.value * 100) + '%' : el.value; };
  if (el.type === 'checkbox') el.checked = S[key]; else el.value = S[key];
  show();
  el.addEventListener('input', () => {
    S[key] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
    show(); save();
    if (key === 'base') setBase(S.base);
    draw();
  });
}
setBase(S.base);
$('fit').onclick = fit;
$('toggle').onclick = () => { $('panel').classList.toggle('collapsed'); setTimeout(() => map.invalidateSize(), 0); };

// ---------- File loading ----------
const drop = $('drop');
function load(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { setPlaying(false); const { pts, skipped } = parseCSV(r.result); setData(pts, skipped, file.name); };
  r.readAsText(file);
}
drop.onclick = () => $('file').click();
$('file').onchange = e => load(e.target.files[0]);
window.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) drop.classList.remove('over'); });
window.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); });
</script>
